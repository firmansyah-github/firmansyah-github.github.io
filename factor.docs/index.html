<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>The Factor Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation for The Factor - Enterprise CRUD Code Generator">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      --base-font-size: 16px;
      --theme-color: #3b82f6;
      --sidebar-width: 24rem;
    }

    /* Make the logo fit nicely and maintain size during resizes */
    .app-name-link img {
      width: 180px !important;
      height: auto !important;
      max-width: 100% !important;
      display: block;
      margin: 0 auto;
    }

    /* Sidebar resizer handle */
    .sidebar-resizer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: calc(var(--sidebar-width) - 3px);
      width: 6px;
      cursor: col-resize;
      z-index: 9999;
      background-color: transparent;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    
    .sidebar-resizer:hover, .sidebar-resizer.is-dragging {
      background-color: var(--theme-color);
      box-shadow: 0 0 8px var(--theme-color);
    }

    @media (max-width: 768px) {
      .sidebar-resizer {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'The Factor Docs',
      repo: 'firmansyah-github/firmansyah-github.github.io',
      basePath: '../',
      homepage: 'factor.docs.overview/README.md',
      loadSidebar: 'factor.docs/_sidebar.md',
      subMaxLevel: 2,
      search: 'auto',
      auto2top: true,
      logo: '../factor.index/logo.png',
      themeColor: '#3b82f6'
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Docsify Themeable -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

  <!-- Mermaid Graph Support -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#1f2937',
        primaryTextColor: '#f1f5f9',
        primaryBorderColor: '#3b82f6',
        lineColor: '#3b82f6',
        secondaryColor: '#111827',
        tertiaryColor: '#0a0e1a'
      }
    });
    window.mermaid = mermaid;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  
  <!-- Draggable Sidebar Resizer -->
  <script>
    (function() {
      // Load saved width from localStorage on startup
      const savedWidth = localStorage.getItem('sidebar-width');
      if (savedWidth) {
        document.documentElement.style.setProperty('--sidebar-width', savedWidth);
      }

      function initResizer() {
        const resizer = document.createElement('div');
        resizer.className = 'sidebar-resizer';
        resizer.id = 'sidebar-resizer';
        document.body.appendChild(resizer);

        let isDragging = false;

        resizer.addEventListener('mousedown', function(e) {
          isDragging = true;
          resizer.classList.add('is-dragging');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          
          const minWidth = 200;
          const maxWidth = 800;
          let newWidth = e.clientX;
          if (newWidth < minWidth) newWidth = minWidth;
          if (newWidth > maxWidth) newWidth = maxWidth;

          const widthStr = newWidth + 'px';
          document.documentElement.style.setProperty('--sidebar-width', widthStr);
          localStorage.setItem('sidebar-width', widthStr);
        });

        document.addEventListener('mouseup', function() {
          if (isDragging) {
            isDragging = false;
            resizer.classList.remove('is-dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initResizer);
      } else {
        initResizer();
      }
    })();
  </script>
</body>

</html>
