apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-index
  namespace: nginx-ns
data:
  index.html: |
    <html>
    <body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
      <h1>Served by NGINX Pod: $(POD_NAME)</h1>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumes:
      - name: index
        configMap:
          name: nginx-index
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-ns
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80        # service port
    targetPort: 80  # pod containerPort
    nodePort: 30080 # fixed NodePort (between 30000–32767)
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-ns
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
